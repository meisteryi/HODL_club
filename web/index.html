<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="금딸 존버 클럽 (NoFap HODL) - 손 떼라 게이야! 뇌 녹지 말고 존버 가즈아">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="금딸 존버">
  <meta name="theme-color" content="#0B0E14">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>금딸 존버 클럽 (NoFap HODL)</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #0B0E14;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    flt-glass-pane,
    flutter-view {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
    }
  </style>
</head>

<body>
  <script>
    // 1. iOS 사파리 스크롤 드리프트 및 터치 오프셋 방지
    window.addEventListener('scroll', function() {
      if (window.scrollY !== 0 || window.scrollX !== 0) {
        window.scrollTo(0, 0);
      }
    }, { passive: false });

    window.addEventListener('resize', function() {
      window.scrollTo(0, 0);
    });

    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    });

    // 2. 홈 화면 앱 삭제 없이 백그라운드 자동 업데이트 (데이터 100% 보존)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(function(registration) {
        // 앱 실행 시 즉시 최신 버전 확인
        registration.update();

        registration.addEventListener('updatefound', function() {
          var newWorker = registration.installing;
          if (newWorker) {
            newWorker.addEventListener('statechange', function() {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // 새 버전 다운로드 완료 시 데이터(로컬스토리지) 보존하며 자동 갱신
                window.location.reload();
              }
            });
          }
        });
      });

      // 새 서비스 워커 활성화 시 자동 리프레시
      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });

      // 백그라운드에서 다시 앱으로 돌아올 때도 버전 체크
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          navigator.serviceWorker.ready.then(function(registration) {
            registration.update();
          });
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
